<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>QnA 홈</title>
</head>
<body>
    <section layout:fragment="content">
        <br>
        <div class="container d-flex justify-content-between w-75">
            <h2 class="mb-0">조회</h2>
            <a th:href="@{/client/QnA/QnAWrite}" id="QnAWriteButton" class="btn btn-warning btn-md">글 쓰기</a>
        </div>
        <form id="searchForm">
            <input type="hidden" name="page" id="page" th:value="${page.pageRequestDTO.page}">
            <input type="hidden" name="size" id="size" th:value="${page.pageRequestDTO.size}">

        </form>
        <br>
        <table class="table w-75 mx-auto text-center">
            <thead>
                <tr>
                    <th scope="col" class="col-1">글 번호</th>
                    <th scope="col" class="col-5">제목</th>
                    <th scope="col" class="col-2">작성자</th>
                    <th scope="col" class="col-2">날짜</th>
                    <th scope="col" class="col-1">조회수</th>
                    <th scope="col" class="col-1">추천</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="qna : ${list}" th:object="${qna}">
                    <td th:text="*{noQnA}"></td>
                    <td><a th:text="*{titleQnA}" th:href="@{/client/QnA/QnAHit/{no}(no=*{noQnA})}"
                           class="text-decoration-none" id="title"></a></td>
                    <td th:text="*{writerQnA}"></td>
                    <td th:text="*{dateQnA}"></td>
                    <td th:text="*{hitsQnA}"></td>
                    <td th:text="*{recommendQnA}"></td>
                </tr>
            </tbody>
        </table>

        <nav th:if="${page.totalCount > 0}" th:object="${page}" aria-label="Page navigation">
            <ul class="pagination justify-content-center"
                th:if="*{startPage != null && endPage != null && startPage <= endPage && startPage > 0}">
                <li class="page-item" th:if="*{previous}">
                    <a href="javascript:void(0);" th:data-page="*{startPage - 1}" class="page-link">이전</a>
                </li>
                <li th:each="number: ${#numbers.sequence(page.startPage, page.endPage)}"
                    th:classappend="${page.pageRequestDTO.page == number ? 'active':''}" class="page-item">
                    <a href="javascript:void(0);" th:data-page="${number}" class="page-link" th:text="${number}"></a>
                </li>
                <li class="page-item" th:if="*{next}">
                    <a href="javascript:void(0);" th:data-page="*{endPage + 1}" class="page-link">다음</a>
                </li>
            </ul>
        </nav>

        <script th:src="@{/js/QnAList.js}" defer></script>
    </section>

    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/QnAList.css}">
    </th:block>
</body>
</html>
