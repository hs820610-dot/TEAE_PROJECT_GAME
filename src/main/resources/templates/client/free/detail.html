<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/free.css">
    <title>Document</title>
</head>
<body>
    <section class="containerMargin container" layout:fragment="content">
        <div class="d-flex justify-content-between">
            <h3 class="text-left">자유 게시판</h3>
            <div class="text-end">
                <a th:href="@{/LOL/free/write}" class="btn btn-primary me-2">
                    글쓰기
                </a>
                <a th:href="@{/LOL/free}" class="btn btn-primary">
                    목록으로
                </a>
            </div>
        </div>

        <table class="table table-bordered">
            <tbody>
                <tr>
                    <th width="10%" class="text-center">제목</th>
                    <td th:text="${free.gameTitle}"></td>
                </tr>
                <tr>
                    <th class="text-center">작성자</th>
                    <td th:text="${free.gameWriter}"></td>
                </tr>

                <tr>
                    <th class="text-center">작성일</th>
                    <td th:text="${#temporals.format(free.gameDate, 'yyyy-MM-dd')}"></td>
                </tr>

                <tr>
                    <th class="text-center">비밀번호</th>
                    <td th:text="${free.gamePasswd}"></td>
                </tr>

                <tr>
                    <th class="text-center d-flex-column">내용</th>
                    <td style="height:500px; white-space:pre-wrap;"
                        th:text="${free.gameContent}">
                    </td>
                </tr>

            </tbody>
        </table>
        <div class="text-end mt-3">
            <form th:action="@{/LOL/free/delete/{gameNo}(gameNo=${free.gameNo})}" method="post" style="display:inline;">

                <button type="submit" class="btn btn-danger">
                    삭제
                </button>

            </form>
            <a th:href="@{/LOL/free/update/{gameNo}(gameNo=${free.gameNo})}"
               class="btn btn-warning">
                수정
            </a>

            <form th:action="@{/LOL/free/delete/{gameNo}(gameNo=${free.gameNo})}" method="post" style="display:inline;">

                <button type="submit" class="btn btn-danger">
                    삭제
                </button>

            </form>
        </div>

    </section>
</body>
</html>
