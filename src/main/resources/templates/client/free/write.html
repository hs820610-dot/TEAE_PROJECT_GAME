<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <section class="container" layout:fragment="content">
        <h3 class="text-left">자유게시판</h3>

        <form th:action="@{/LOL/free/write}" method="post" id="writeForm">
            <div class="mb-3">
                <label for="writeTitle" class="form-label">제목</label>
                <input type="text" id="writeTitle" name="gameTitle" class="form-control" placeholder="제목을 입력하세요.">
            </div>
            <div class="mb-3" row>
                <label for="writeContent" class="form-label">
                    내용
                </label>
                <textarea id="writeContent" class="form-control" name="gameContent" rows="10" placeholder="내용을 입력하세요"></textarea>
            </div>
            <div class="mb-3">
                <label for="writeWriter" class="form-label">작성자</label>
                <input type="text" id="writeWriter" class="form-control" name="gameWriter" placeholder="작성자명을 입력하세요.">
            </div>
            <div class="mb-3">
                <label for="writePasswd" class="form-label">비밀번호</label>
                <input type="text" id="writePasswd" class="form-control" name="gamePasswd" placeholder="비밀번호를 입력하세요.">
            </div>
            <div class="text-end">
                <button type="submit" class="btn btn-primary" >등록</button>
                <a th:href="@{/LOL/free}" class="btn btn-primary">취소</a>
            </div>
        </form>
    </section>
    <script src="/js/freeWrite.js"></script>
</body>
</html>
